<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArbeitszeitTracker</title>
  <link rel="icon" type="image/svg+xml" href="../static/icons/app.svg">
  <link rel="icon" type="image/png" href="../static/icons/app.png">
  <style>
    html, body { margin: 0; min-height: 100%; background: #f8fafc; color: #172033; }
    .loading { padding: 24px; color: #526070; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>
  <link rel="stylesheet" href="../static/css/app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Hauptnavigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">A</span>
        <div>
          <strong>ArbeitszeitTracker</strong>
          <small>Lokal & privat</small>
        </div>
      </div>
      <nav class="nav nav-primary">
        <button data-view="dashboard" class="active nav-dashboard" title="Dashboard" aria-label="Dashboard"><span class="nav-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10.5V20h14v-9.5"/><path d="M9 20v-6h6v6"/></svg></span><span class="nav-label">Dashboard</span></button>
        <button data-view="calendar" class="nav-calendar" title="Kalender" aria-label="Kalender"><span class="nav-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M7 3v4M17 3v4"/><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16"/><path d="M8 14h3M13 14h3M8 17h3"/></svg></span><span class="nav-label">Kalender</span></button>
        <button data-view="entries" class="nav-entries" title="Einträge" aria-label="Einträge"><span class="nav-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg></span><span class="nav-label">Einträge</span></button>
        <button data-view="statistics" class="nav-statistics" title="Statistiken" aria-label="Statistiken"><span class="nav-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 20h16"/><rect x="6" y="11" width="3" height="6" rx="1"/><rect x="11" y="7" width="3" height="10" rx="1"/><rect x="16" y="4" width="3" height="13" rx="1"/></svg></span><span class="nav-label">Statistiken</span></button>
        <button data-view="vacation" class="nav-vacation" title="Urlaub und Abwesenheiten" aria-label="Urlaub und Abwesenheiten"><span class="nav-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M10 20h8a2 2 0 0 0 2-2V9H4v9a2 2 0 0 0 2 2h1"/><path d="M8 9V7a4 4 0 0 1 8 0v2"/><path d="M8 14h8"/></svg></span><span class="nav-label">Urlaub und Abwesenheiten</span></button>
        <button data-view="calculator" class="nav-calculator" title="Arbeitszeit Rechner" aria-label="Arbeitszeit Rechner"><span class="nav-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 18h4"/></svg></span><span class="nav-label">Arbeitszeit Rechner</span></button>
      </nav>
      <nav class="nav nav-bottom">
        <button data-view="settings" class="nav-settings" title="Einstellungen" aria-label="Einstellungen"><span class="nav-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9 7 7M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></span><span class="nav-label">Einstellungen</span></button>
        <button id="refresh-view" class="sidebar-refresh nav-refresh" type="button" title="Aktualisieren" aria-label="Aktualisieren"><span class="nav-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M20 6v5h-5"/><path d="M4 18v-5h5"/><path d="M19 11a7 7 0 0 0-12-4l-3 3"/><path d="M5 13a7 7 0 0 0 12 4l3-3"/></svg></span><span class="nav-label">Aktualisieren</span></button>
      </nav>
    </aside>
    <main class="content" id="content" tabindex="-1">
      <section class="loading">Lade Arbeitszeitdaten …</section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="../static/js/app.js"></script>
</body>
</html>
